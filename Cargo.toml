[package]
name = "ringmaster"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local-first Rust TUI observability app for Oura Cloud data"
readme = "README.md"
repository = "https://github.com/jkordish/ringmaster.rs"
rust-version = "1.88"
keywords = ["oura", "ratatui", "tui", "terminal", "sqlite"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "ringmaster"
path = "src/lib.rs"

[[bin]]
name = "ringmaster"
path = "src/main.rs"

[dependencies]
axum = "0.8.8"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
hex = "0.4.3"
hmac = "0.13.0"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
ratatui = "0.30.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
# Pinned to v4 until keyring moves its Secret Service backend to the newer major.
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
